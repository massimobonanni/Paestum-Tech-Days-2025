name: Deploy to GitHub Pages

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual update of content'
  
  # Automatic trigger on push to main branch
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - '_config.yml'
      - '_layouts/**'
      - '_includes/**'
      - 'index.html'
      - '.github/workflows/pages.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        run: |
          gem install jekyll bundler
          bundle init
          echo 'gem "jekyll", "~> 4.3"' >> Gemfile
          echo 'gem "minima", "~> 2.5"' >> Gemfile
          echo 'gem "jekyll-feed", "~> 0.12"' >> Gemfile
          echo 'gem "jekyll-sitemap", "~> 1.4"' >> Gemfile
          bundle install
          
      - name: Sync markdown content to Jekyll collections
        run: |
          # Ensure Jekyll collections directories exist
          mkdir -p _trainer_demos _student_demos _materiale
          
          # Copy trainer demos
          if [ -d "Demos/Trainer" ]; then
            cp -r Demos/Trainer/* _trainer_demos/ 2>/dev/null || true
          fi
          
          # Copy student demos  
          if [ -d "Demos/Student" ]; then
            cp -r Demos/Student/* _student_demos/ 2>/dev/null || true
          fi
          
          # Copy materials (only markdown files)
          if [ -d "Materiale" ]; then
            find Materiale -name "*.md" -exec cp {} _materiale/ \; 2>/dev/null || true
          fi
          
          echo "Content synchronized to Jekyll collections"
          
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4